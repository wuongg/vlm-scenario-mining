  lane_intrusion: ["lấn làn", "lan intrusion", "xâm nhập làn"]
  sidewalk_mount: ["lên vỉa hè", "leo vỉa hè", "sidewalk", "walkway"]
  ped_cross: ["người đi bộ sang đường", "người sang đường", "pedestrian crossing", "jaywalk"]
  red_light: ["vượt đèn đỏ", "đèn đỏ", "red light"]
