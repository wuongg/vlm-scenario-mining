# 9+1 classes. Source: repo_design_v1.md mining-rule identifiers + DATA_SOURCE caveats.
# DESIGN_LOG ontology was not in the workspace on Day 1 — swap this file if it differs.
# Multi-label rule: 1 maneuver + 0-1 spatial + optional ped_cross. none XOR any class.

families:
  maneuver: [cut_in, cut_out, lead_braking, overtaking]
  spatial: [lane_split_moto, lane_intrusion, sidewalk_mount]
  vru: [ped_cross]
  signal: [red_light]
  none: [none]

precedence:
  - none
  - uncertain
  - maneuver
  - spatial
  - vru
  - signal

pegasus_6lm:
  L1_road: "Road geometry, lanes, markings"
  L2_infra: "Traffic infrastructure: signs, lights"
  L3_temp: "Temporary modifications of L1/L2"
  L4_objects: "Moving and stationary objects"
  L5_environment: "Weather, lighting, visibility"
  L6_digital: "Digital information, maps, V2X"

classes:
  cut_in:
    family: maneuver
    pegasus: [L4_objects, L1_road]
    trigger: "Another vehicle enters the ego lane from an adjacent lane and becomes the lead, closing laterally then longitudinally."
    exclude: "Ego lane-change; already-ahead vehicle; parked vehicle that never occupies the ego path."
  cut_out:
    family: maneuver
    pegasus: [L4_objects, L1_road]
    trigger: "Lead vehicle leaves the ego lane, exposing a new lead or empty path."
    exclude: "Lead turning at an intersection while remaining in a dedicated turn lane that ego is not in."
  lead_braking:
    family: maneuver
    pegasus: [L4_objects]
    trigger: "Lead vehicle decelerates sharply in-lane (closure slope on 1/h, not a single-frame jump)."
    exclude: "Ego braking with a stable lead; stopped traffic already at rest for the whole window."
  overtaking:
    family: maneuver
    pegasus: [L4_objects, L1_road]
    trigger: "A vehicle passes ego or ego is passed, with a completed along-track order swap."
    exclude: "Parallel travel with no order swap; oncoming traffic."
  lane_split_moto:
    family: spatial
    pegasus: [L4_objects, L1_road]
    trigger: "Motorcycle straddles the lane boundary (≥3 frames, moving) — VN 'xe máy cắt làn'."
    exclude: "Motorcycle fully inside one lane; bicycle; parked two-wheeler on the shoulder."
  lane_intrusion:
    family: spatial
    pegasus: [L4_objects, L1_road]
    trigger: "Object bbox intersects the ego-lane polygon ≥25% for ≥2 frames (positive predicate)."
    exclude: "Legal occupancy of the ego lane (lead/behind); map-mode degraded without a lane polygon AND no pixel-band fallback fired."
  sidewalk_mount:
    family: spatial
    pegasus: [L1_road, L4_objects]
    trigger: "≥50% of the object bbox sits on walkway (Mode A) or non-road mask (Mode B)."
    exclude: "Pedestrian on sidewalk; vehicle legally in a driveway cut."
  ped_cross:
    family: vru
    pegasus: [L4_objects, L1_road]
    trigger: "Pedestrian or cyclist crosses the ego path or a marked/unmarked crossing in-window."
    exclude: "Pedestrian waiting on the curb with no trajectory into the roadway."
  red_light:
    family: signal
    pegasus: [L2_infra, L4_objects]
    trigger: "A relevant actor (ego or other) is in the intersection while the facing signal is red."
    exclude: "No GT for signal state on nuScenes mini — do not score as a VLM miss; use signal_state=unclear when the lamp is unreadable."
  none:
    family: none
    pegasus: []
    trigger: "No listed scenario is clearly present in the window."
    exclude: "Do not combine with any positive class. Use uncertain instead of none when the definition is doubtful."

detector_phrases:
  # Grounding-DINO-tiny: per-phrase "class ." lowercase, remove_combined=true. No repetition trick.
  - "car ."
  - "truck ."
  - "bus ."
  - "motorcycle ."
  - "bicycle ."
  - "pedestrian ."
  - "traffic light ."
  - "traffic sign ."

vn_synonyms:
  cut_in: ["cắt đầu", "cắt vào làn", "xe cắt vào", "cut in"]
  cut_out: ["cắt ra", "tách làn", "cut out"]
