name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Pytest (synthetic only)
        run: pytest -q -m "not slow"

  mini-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Synthetic cascade selftest
        run: python -m vsm.selftest cascade_synthetic
# fail-fast: no matrix. No job downloads nuScenes.
