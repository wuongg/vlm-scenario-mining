# Spec 9+1 (Day 2 REPLACE of D3). Two families for scoring:
#   safety_* = recall-first; compliance = precision-first.
# uncertain is a schema slot, not a class. none = empty-per-taxonomy.
# Multi-label axes: 1 safety_maneuver + 0-1 spatial-slot + optional pedestrian_cross.
# Spatial-slot members = safety_spatial minus pedestrian_cross (VRU is the third axis).

families:
  safety_maneuver: [cut_in, lead_braking, oncoming, turn_lane_drift]
  safety_spatial: [lane_split_moto, sidewalk_mount, lane_intrusion, pedestrian_cross]
  compliance: [red_light_violation]
  none: [none]

label_axes:
  maneuver: safety_maneuver
  spatial_slot: [lane_split_moto, sidewalk_mount, lane_intrusion]
  vru_slot: pedestrian_cross
  max_maneuver: 1
  max_spatial_slot: 1

precedence:
  - none
  - uncertain
  - safety_maneuver
  - safety_spatial
  - compliance

pegasus_6lm:
  L1_road: "Road geometry, lanes, markings"
  L2_infra: "Traffic infrastructure: signs, lights"
  L3_temp: "Temporary modifications of L1/L2"
  L4_objects: "Moving and stationary objects"
  L5_environment: "Weather, lighting, visibility"
  L6_digital: "Digital information, maps, V2X"

classes:
  cut_in:
    family: safety_maneuver
    pegasus: [L4_objects, L1_road]
    trigger: "Another vehicle enters the ego lane from an adjacent lane and becomes the lead, closing laterally then longitudinally."
    exclude: "Ego lane-change; already-ahead vehicle; parked vehicle that never occupies the ego path. signal_state is an ATTRIBUTE (on|off|unclear) and does not participate in matching."
  lead_braking:
    family: safety_maneuver
    pegasus: [L4_objects]
    trigger: "Lead vehicle decelerates sharply in-lane (closure slope on 1/h over the window, not a single-frame jump)."
    exclude: "Ego braking with a stable lead; stopped traffic already at rest for the whole window."
  oncoming:
    family: safety_maneuver
    pegasus: [L4_objects, L1_road]
    trigger: "WRONG-WAY-ONLY: an actor occupies a lane whose legal travel direction is opposite the actor's heading."
    exclude: "Oncoming traffic in a correctly oriented opposite lane (standard two-way). If this EXCLUDE is ignored the class has ~100% prevalence and dies."
  turn_lane_drift:
    family: safety_maneuver
    pegasus: [L1_road, L4_objects]
    trigger: "A vehicle in a dedicated turn-lane proceeds straight through the intersection instead of turning (one frozen turn direction)."
    exclude: "Vehicle that turns as the dedicated lane requires; through-lane traffic that never entered a turn pocket."
  lane_split_moto:
    family: safety_spatial
    pegasus: [L4_objects, L1_road]
    trigger: "Motorcycle straddles the lane boundary (≥3 frames, moving) — VN 'xe máy cắt làn'."
    exclude: "Motorcycle fully inside one lane; bicycle; parked two-wheeler on the shoulder."
  sidewalk_mount:
    family: safety_spatial
    pegasus: [L1_road, L4_objects]
    trigger: "≥50% of the object bbox sits on walkway (Mode A) or non-road mask (Mode B)."
    exclude: "Pedestrian on sidewalk; vehicle legally in a driveway cut."
  lane_intrusion:
    family: safety_spatial
    pegasus: [L4_objects, L1_road]
    trigger: "Object bbox intersects the ego-lane polygon ≥25% for ≥2 frames (positive predicate, not a residual catch-all)."
    exclude: "Legal occupancy of the ego lane (lead/behind); map-mode degraded without a lane polygon AND no pixel-band fallback fired."
  pedestrian_cross:
    family: safety_spatial
    pegasus: [L4_objects, L1_road]
    trigger: "Pedestrian or cyclist crosses the ego path or a marked/unmarked crossing in-window."
    exclude: "Pedestrian waiting on the curb with no trajectory into the roadway."
  red_light_violation:
    family: compliance
    pegasus: [L2_infra, L4_objects]
    trigger: "EVENT: a relevant actor (ego or other) occupies the intersection against a red facing signal — a violation, not a lamp-state class."
    exclude: "Lamp visible but no actor in the intersection; signal_state is an ATTRIBUTE (on|off|unclear) and is not itself the class. No signal-state GT on nuScenes mini."
  none:
    family: none
    pegasus: []
    trigger: "No listed scenario is clearly present in the window (empty-per-taxonomy)."
    exclude: "Do not combine with any positive class. Use the uncertain schema slot (not a class) when the definition is doubtful."

detector_phrases:
  # Grounding-DINO-tiny: per-phrase "class ." lowercase, remove_combined=true. No repetition trick.
  - "car ."
  - "truck ."
  - "bus ."
  - "motorcycle ."
  - "bicycle ."
  - "pedestrian ."
  - "traffic light ."
  - "traffic sign ."

